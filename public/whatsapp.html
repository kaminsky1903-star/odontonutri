    <script>
      (function () {
        try {
          var mode = localStorage.getItem("odontonutri-theme") || "auto";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      :root,
      html[data-theme="light"] {
        --bg: #fbf8f2;
        --ink: #1c2420;
        --muted: #5b675f;
        --line: #e4ddd2;
        --accent: #2f4a3c;
        color-scheme: light;
      }

      html[data-theme="dark"] {
        --bg: #141a17;
        --ink: #f4f1eb;
        --muted: #a8b3ac;
        --line: #33403a;
        --accent: #4d9a84;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "DM Sans", Segoe UI, sans-serif;
        line-height: 1.5;
      }

      header {
        padding: 1.15rem 0;
        border-bottom: 1px solid color-mix(in srgb, var(--accent) 12%, transparent);
      }

      .page-container {
        width: calc(100% - 48px);
        max-width: 1120px;
        margin-inline: auto;
      }

      .brand {
        letter-spacing: -0.03em;
        align-items: center;
        gap: 0.7rem;
        font-family: Fraunces, Georgia, serif;
        font-size: 1.15rem;
        line-height: 1.15;
        display: flex;
        text-decoration: none;
        color: inherit;
      }

      .brand img {
        width: 2.5rem;
        height: 2.5rem;
        flex-shrink: 0;
        object-fit: contain;
      }

      main {
        min-height: calc(100vh - 5.5rem);
        display: grid;
        place-items: center;
        padding: 3rem 0;
      }

      h1 {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--accent);
        text-align: center;
      }

      .fallback {
        margin: 1.1rem 0 0;
        color: var(--muted);
        text-align: center;
      }

      .fallback a {
        color: var(--accent);
        font-weight: 600;
      }

      @media (width <= 840px) {
        .page-container {
          width: calc(100% - 40px);
        }

        .brand {
          font-size: 1rem;
        }
      }
    </style>

  <body>
    <header>

        </a>
      </div>
    </header>
    <main>
      <div class="page-container">
        <h1>Abriendo WhatsApp…</h1>
        <p class="fallback">
          <a href="https://wa.link/g6wqj3">Si no se abre, continuá acá</a>
        </p>
      </div>
    </main>
    <script>
      window.setTimeout(function () {
        var text = new URLSearchParams(window.location.search).get("text");
        if (text) {
          window.location.replace(
            "https://wa.me/541161370040?text=" + encodeURIComponent(text),
          );
          return;
        }
        window.location.replace("https://wa.link/g6wqj3");
      }, 1000);

      (function () {
        var text = new URLSearchParams(window.location.search).get("text");
        if (!text) return;
        var dest =
          "https://wa.me/541161370040?text=" + encodeURIComponent(text);
        var fallback = document.querySelector(".fallback a");
        if (fallback) fallback.setAttribute("href", dest);
        var refresh = document.querySelector('meta[http-equiv="refresh"]');
        if (refresh) refresh.remove();
      })();
    </script>
  </body>
</html>
